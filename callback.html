<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
  <title>FAC · Clover</title>
  <style>
    body { font-family: Segoe UI, sans-serif; margin: 2rem; color: #222; }
    p { max-width: 36rem; line-height: 1.4; }
  </style>
</head>
<body>
  <p id="status">Conectando Clover con FAC…</p>
  <p>Si el navegador no puede conectar, abre FAC e inicia nuevamente la conexión con Clover.</p>
  <script>
    (function () {
      var LOOPBACK = 'http://127.0.0.1:53682/clover/oauth/callback';
      var statusEl = document.getElementById('status');
      var params = new URLSearchParams(window.location.search);
      var error = params.get('error');
      var code = params.get('code');
      var state = params.get('state');
      var merchantId = params.get('merchant_id') || params.get('merchantId');
      var clientId = params.get('client_id');
      var employeeId = params.get('employee_id');
      var errorDescription = params.get('error_description');
      var query = new URLSearchParams();

      function forward() {
        window.setTimeout(function () {
          window.location.replace(LOOPBACK + '?' + query.toString());
        }, 250);
      }

      if (error) {
        query.set('error', error);
        if (state) query.set('state', state);
        if (errorDescription) query.set('error_description', errorDescription);
        if (merchantId) query.set('merchant_id', merchantId);
        if (clientId) query.set('client_id', clientId);
        forward();
        return;
      }

      if (!code || !state || !merchantId) {
        statusEl.textContent = 'No pudimos conectar con FAC. Abre FAC e inicia nuevamente la conexión con Clover.';
        return;
      }

      query.set('code', code);
      query.set('state', state);
      query.set('merchant_id', merchantId);
      if (clientId) query.set('client_id', clientId);
      if (employeeId) query.set('employee_id', employeeId);
      forward();
    })();
  </script>
</body>
</html>
